# Countries processed one after another by the country_sweep_sensor.
# This file is re-read on every sensor tick, changes apply without a restart.

# true: recompute all indicator results from scratch (first attempt only,
# the retry of a failed run only re-queries the failed rows)
overwrite: false

# iso: ISO3 code as in countries.yaml
# h3:  also build and process the h3 hexagon layer
countries:
- {iso: AFG, h3: false}  # Afghanistan
- {iso: BGD, h3: false}  # Bangladesh
- {iso: CAF, h3: false}  # Central African Republic
- {iso: COD, h3: false}  # DR Congo
